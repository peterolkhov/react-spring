name: visual52 review99 cancellation predicate diagnosis
on:
  workflow_dispatch:
  push:
    branches: [codex/observe-spring-cancel99]
permissions:
  contents: read
jobs:
  bounded-native-observation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: pmndrs/react-spring
          ref: 83e476061290532ab517c4d4dfd60de21589e78e
          path: original
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: pmndrs/react-spring
          ref: 83e476061290532ab517c4d4dfd60de21589e78e
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.14.0
          run_install: false
      - name: Stage sealed observational payload 1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCHUNK'
          import os,pathlib
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'review99';r.mkdir(exist_ok=True)
          (r/'payload.b64').write_text('')
          PYCHUNK
      - name: Stage sealed observational payload 2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCHUNK'
          import os,pathlib
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'review99';r.mkdir(exist_ok=True)
          with (r/'payload.b64').open('a') as f:f.write('')
          PYCHUNK
      - name: Stage sealed observational payload 3
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCHUNK'
          import os,pathlib
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'review99';r.mkdir(exist_ok=True)
          with (r/'payload.b64').open('a') as f:f.write('')
          PYCHUNK
      - name: Stage sealed observational payload 4
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCHUNK'
          import os,pathlib
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'review99';r.mkdir(exist_ok=True)
          with (r/'payload.b64').open('a') as f:f.write('')
          PYCHUNK
      - name: Stage sealed observational payload 5
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCHUNK'
          import os,pathlib
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'review99';r.mkdir(exist_ok=True)
          with (r/'payload.b64').open('a') as f:f.write('')
          PYCHUNK
      - name: Unpack and freeze both exact source states and immutable fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYASSETS'
          import base64,hashlib,json,os,pathlib,zlib
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'review99'
          a=json.loads(zlib.decompress(base64.b64decode((r/'payload.b64').read_text(),validate=True)))
          s=json.loads(a['asset-seals.json']);assert set(a)==set(s)|{'asset-seals.json'}
          for n,t in a.items():
           assert pathlib.PurePosixPath(n).name==n
           if n in s:assert hashlib.sha256(t.encode()).hexdigest()==s[n],n
           (r/n).write_text(t)
          print('VISUAL52_REVIEW99_ASSET_SEALS '+json.dumps(s,sort_keys=True))
          for d in ['original','candidate']:
           root=pathlib.Path(d)/'packages/core/src'
           for asset,target in [('frozen10.ts','visual52-native-before.test.ts'),('frozen3.ts','visual52-review58.test.ts'),('frozen5.ts','visual52-review71.test.ts'),('frozen6.ts','visual52-review83.test.ts'),('review99.ts','visual52-review99.test.ts')]:
            (root/target).write_text(a[asset])
           for asset,target in [('permanent23.ts','scheduleProps.test.ts'),('supplement22.ts','Controller.stop.test.ts'),('reentrant12.ts','Controller.reentrant.test.ts')]:
            if d=='original':(root/target).write_text(a[asset])
           if d=='original':
            matches=[n for n in a if n.startswith('onprops') and n.endswith('.ts')]
            assert len(matches)==1
            (root/'Controller.onProps.test.ts').write_text(a[matches[0]])
          PYASSETS
          git -C candidate apply --check "$RUNNER_TEMP/review99/candidate.patch"
          git -C candidate apply "$RUNNER_TEMP/review99/candidate.patch"
          python3 "$RUNNER_TEMP/review99/guard.py" capture original
          python3 "$RUNNER_TEMP/review99/guard.py" capture candidate
      - name: Install frozen dependencies and official Chromium
        shell: bash
        run: |
          set -euo pipefail
          (cd original && pnpm install --frozen-lockfile)
          (cd candidate && pnpm install --frozen-lockfile)
          (cd candidate && pnpm exec playwright install --with-deps chromium)
      - name: Observe original public cancellation-predicate outcomes
        working-directory: original
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm exec vitest run --project unit packages/core/src/visual52-review99.test.ts --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/review99/original.json" 2>&1 | tee "$RUNNER_TEMP/review99/original.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "VISUAL52_REVIEW99_ORIGINAL_PROCESS_STATUS $status"
          echo VISUAL52_REVIEW99_ORIGINAL_RAW_JSON_BEGIN
          cat "$RUNNER_TEMP/review99/original.json"
          echo VISUAL52_REVIEW99_ORIGINAL_RAW_JSON_END
          python3 "$RUNNER_TEMP/review99/assess99.py" "$RUNNER_TEMP/review99/original.json" "$RUNNER_TEMP/review99/original.log" "$status"
      - name: Observe candidate public cancellation-predicate outcomes
        working-directory: candidate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm exec vitest run --project unit packages/core/src/visual52-review99.test.ts --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/review99/candidate.json" 2>&1 | tee "$RUNNER_TEMP/review99/candidate.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "VISUAL52_REVIEW99_CANDIDATE_PROCESS_STATUS $status"
          echo VISUAL52_REVIEW99_CANDIDATE_RAW_JSON_BEGIN
          cat "$RUNNER_TEMP/review99/candidate.json"
          echo VISUAL52_REVIEW99_CANDIDATE_RAW_JSON_END
          python3 "$RUNNER_TEMP/review99/assess99.py" "$RUNNER_TEMP/review99/candidate.json" "$RUNNER_TEMP/review99/candidate.log" "$status"
      - name: Verify both complete source states and every fixture remain frozen
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/review99/guard.py" verify original
          python3 "$RUNNER_TEMP/review99/guard.py" verify candidate
