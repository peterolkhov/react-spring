name: visual52 repair174 four distinct compiler qualification
permissions:
  contents: read
jobs:
  compiler-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ts:
        - 5.7.3
        - 5.9.3
        - 6.0.3
        - 7.0.2
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: pmndrs/react-spring
        ref: 83e476061290532ab517c4d4dfd60de21589e78e
        path: candidate
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.22.0
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      with:
        version: 12.14.0
        run_install: false
    - name: Define external frozen verification paths
      shell: bash
      run: |
        set -euo pipefail
        echo "REPAIR_ASSETS=$RUNNER_TEMP/repair120" >> "$GITHUB_ENV"
        echo "REPAIR_RESULTS=$RUNNER_TEMP/repair120/results" >> "$GITHUB_ENV"
    - name: Stage sealed immutable payload part 1
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYCHUNK'
        import os,pathlib
        r=pathlib.Path(os.environ['REPAIR_ASSETS']);r.mkdir(exist_ok=True)
        (r/'payload.b64').write_text('')
        PYCHUNK
    - name: Stage sealed immutable payload part 2
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYCHUNK'
        import os,pathlib
        r=pathlib.Path(os.environ['REPAIR_ASSETS']);r.mkdir(exist_ok=True)
        with (r/'payload.b64').open('a') as stream:stream.write('')
        PYCHUNK
    - name: Stage sealed immutable payload part 3
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYCHUNK'
        import os,pathlib
        r=pathlib.Path(os.environ['REPAIR_ASSETS']);r.mkdir(exist_ok=True)
        with (r/'payload.b64').open('a') as stream:stream.write('')
        PYCHUNK
    - name: Stage sealed immutable payload part 4
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYCHUNK'
        import os,pathlib
        r=pathlib.Path(os.environ['REPAIR_ASSETS']);r.mkdir(exist_ok=True)
        with (r/'payload.b64').open('a') as stream:stream.write('')
        PYCHUNK
    - name: Stage sealed immutable payload part 5
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYCHUNK'
        import os,pathlib
        r=pathlib.Path(os.environ['REPAIR_ASSETS']);r.mkdir(exist_ok=True)
        with (r/'payload.b64').open('a') as stream:stream.write('')
        PYCHUNK
    - name: Stage sealed immutable payload part 6
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYCHUNK'
        import os,pathlib
        r=pathlib.Path(os.environ['REPAIR_ASSETS']);r.mkdir(exist_ok=True)
        with (r/'payload.b64').open('a') as stream:stream.write('')
        PYCHUNK
    - name: Stage sealed immutable payload part 7
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYCHUNK'
        import os,pathlib
        r=pathlib.Path(os.environ['REPAIR_ASSETS']);r.mkdir(exist_ok=True)
        with (r/'payload.b64').open('a') as stream:stream.write('')
        PYCHUNK
    - name: Prepare and freeze exact candidate matrix source
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYASSETS'
        import base64,hashlib,json,os,pathlib,zlib
        r=pathlib.Path(os.environ['RUNNER_TEMP'])/'repair120'
        assets=json.loads(zlib.decompress(base64.b64decode((r/'payload.b64').read_text(),validate=True)))
        seals=json.loads(assets['asset-seals.json'])
        assert set(assets)==set(seals)|{'asset-seals.json'}
        for name,text in assets.items():
            assert pathlib.PurePosixPath(name).name==name
            if name in seals:assert hashlib.sha256(text.encode()).hexdigest()==seals[name],name
            (r/name).write_text(text)
        PYASSETS
        cp "$RUNNER_TEMP/repair120/frozen10.ts" candidate/packages/core/src/visual52-native-before.test.ts
        cp "$RUNNER_TEMP/repair120/frozen3.ts" candidate/packages/core/src/visual52-review58.test.ts
        cp "$RUNNER_TEMP/repair120/frozen5.ts" candidate/packages/core/src/visual52-review71.test.ts
        cp "$RUNNER_TEMP/repair120/frozen6.ts" candidate/packages/core/src/visual52-review83.test.ts
        cp "$RUNNER_TEMP/repair120/review99.ts" candidate/packages/core/src/visual52-review99.test.ts
        git -C candidate apply --check "$RUNNER_TEMP/repair120/candidate.patch"
        git -C candidate apply "$RUNNER_TEMP/repair120/candidate.patch"
        python3 "$RUNNER_TEMP/repair120/guard.py" capture candidate
    - name: Install exact frozen candidate dependencies
      working-directory: candidate
      shell: bash
      run: |
        pnpm install --frozen-lockfile
    - name: Select exact external compiler package aliases and CLI before sole baseline
      working-directory: candidate
      shell: bash
      run: |
        set -euo pipefail
        mkdir "$RUNNER_TEMP/repair174-compiler"
        mkdir -p "$REPAIR_RESULTS"
        printf '{"private":true}
        ' > "$RUNNER_TEMP/repair174-compiler/package.json"
        pnpm --dir "$RUNNER_TEMP/repair174-compiler" add --ignore-scripts typescript@${{ matrix.ts }}
        pnpm exec node "$REPAIR_ASSETS/compiler174.mjs" setup setup-before-baseline
    - name: Capture exact runtime inputs once after declared setup
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYSEALS'
        import hashlib,json,os,pathlib
        r=pathlib.Path(os.environ['REPAIR_ASSETS']);raw=(r/'asset-seals.json').read_bytes()
        assert hashlib.sha256(raw).hexdigest()=='89e8781cc47df7990612f9af5dc41f3fd535e3bc783ca237e480013463166669'
        for name,expected in json.loads(raw).items():
         assert pathlib.PurePosixPath(name).name==name
         assert hashlib.sha256((r/name).read_bytes()).hexdigest()==expected,name
        print('VISUAL52_REPAIR120_ASSET_SEALS 89e8781cc47df7990612f9af5dc41f3fd535e3bc783ca237e480013463166669')
        PYSEALS
        python3 "$REPAIR_ASSETS/integrity120.py" capture "$GITHUB_WORKSPACE/candidate" tests
        echo 'REPAIR_READY=true' >> "$GITHUB_ENV"
    - name: Run compiler matrix build
      if: always() && env.REPAIR_READY == 'true'
      working-directory: candidate
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYSEALS'
        import hashlib,json,os,pathlib
        r=pathlib.Path(os.environ['REPAIR_ASSETS']);raw=(r/'asset-seals.json').read_bytes()
        assert hashlib.sha256(raw).hexdigest()=='89e8781cc47df7990612f9af5dc41f3fd535e3bc783ca237e480013463166669'
        for name,expected in json.loads(raw).items():
         assert pathlib.PurePosixPath(name).name==name
         assert hashlib.sha256((r/name).read_bytes()).hexdigest()==expected,name
        print('VISUAL52_REPAIR120_ASSET_SEALS 89e8781cc47df7990612f9af5dc41f3fd535e3bc783ca237e480013463166669')
        PYSEALS
        status=0
        python3 "$REPAIR_ASSETS/integrity120.py" verify "$GITHUB_WORKSPACE/candidate" tests || status=1
        test "$status" = 0
        set -euo pipefail
        pnpm exec node "$REPAIR_ASSETS/compiler174.mjs" verify build
        set +e
        pnpm build-ci 2>&1 | tee "$RUNNER_TEMP/repair120/matrix-build.log"
        status=${PIPESTATUS[0]}
        set -e
        echo "VISUAL52_REPAIR120_COMPILER_GATE build $status"
        exit "$status"
      id: declared_build
    - name: Declare exact generated build phase without accepting other drift
      if: always() && env.REPAIR_READY == 'true' && steps.declared_build.outcome == 'success'
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYSEALS'
        import hashlib,json,os,pathlib
        r=pathlib.Path(os.environ['REPAIR_ASSETS']);raw=(r/'asset-seals.json').read_bytes()
        assert hashlib.sha256(raw).hexdigest()=='89e8781cc47df7990612f9af5dc41f3fd535e3bc783ca237e480013463166669'
        for name,expected in json.loads(raw).items():
         assert pathlib.PurePosixPath(name).name==name
         assert hashlib.sha256((r/name).read_bytes()).hexdigest()==expected,name
        print('VISUAL52_REPAIR120_ASSET_SEALS 89e8781cc47df7990612f9af5dc41f3fd535e3bc783ca237e480013463166669')
        PYSEALS
        python3 "$REPAIR_ASSETS/integrity120.py" transition-build "$GITHUB_WORKSPACE/candidate" after-build tests
        echo "REPAIR_RUNTIME_PHASE=after-build" >> "$GITHUB_ENV"
    - name: Always verify runtime after Run compiler matrix build
      if: always() && env.REPAIR_READY == 'true'
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYSEALS'
        import hashlib,json,os,pathlib
        r=pathlib.Path(os.environ['REPAIR_ASSETS']);raw=(r/'asset-seals.json').read_bytes()
        assert hashlib.sha256(raw).hexdigest()=='89e8781cc47df7990612f9af5dc41f3fd535e3bc783ca237e480013463166669'
        for name,expected in json.loads(raw).items():
         assert pathlib.PurePosixPath(name).name==name
         assert hashlib.sha256((r/name).read_bytes()).hexdigest()==expected,name
        print('VISUAL52_REPAIR120_ASSET_SEALS 89e8781cc47df7990612f9af5dc41f3fd535e3bc783ca237e480013463166669')
        PYSEALS
        status=0
        python3 "$REPAIR_ASSETS/integrity120.py" verify "$GITHUB_WORKSPACE/candidate" ${REPAIR_RUNTIME_PHASE:-tests} || status=1
        test "$status" = 0
    - name: Run compiler matrix repo-types
      if: always() && env.REPAIR_READY == 'true'
      working-directory: candidate
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYSEALS'
