        assert hashlib.sha256(raw).hexdigest()=='89e8781cc47df7990612f9af5dc41f3fd535e3bc783ca237e480013463166669'
        for name,expected in json.loads(raw).items():
         assert pathlib.PurePosixPath(name).name==name
         assert hashlib.sha256((r/name).read_bytes()).hexdigest()==expected,name
        print('VISUAL52_REPAIR120_ASSET_SEALS 89e8781cc47df7990612f9af5dc41f3fd535e3bc783ca237e480013463166669')
        PYSEALS
        status=0
        python3 "$REPAIR_ASSETS/integrity120.py" verify "$GITHUB_WORKSPACE/candidate" ${REPAIR_RUNTIME_PHASE:-tests} || status=1
        test "$status" = 0
        set -euo pipefail
        pnpm exec node "$REPAIR_ASSETS/compiler174.mjs" verify repo-types
        set +e
        pnpm check:types 2>&1 | tee "$RUNNER_TEMP/repair120/matrix-repo-types.log"
        status=${PIPESTATUS[0]}
        set -e
        echo "VISUAL52_REPAIR120_COMPILER_GATE repo-types $status"
        exit "$status"
    - name: Always verify runtime after Run compiler matrix repo-types
      if: always() && env.REPAIR_READY == 'true'
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYSEALS'
        import hashlib,json,os,pathlib
        r=pathlib.Path(os.environ['REPAIR_ASSETS']);raw=(r/'asset-seals.json').read_bytes()
        assert hashlib.sha256(raw).hexdigest()=='89e8781cc47df7990612f9af5dc41f3fd535e3bc783ca237e480013463166669'
        for name,expected in json.loads(raw).items():
         assert pathlib.PurePosixPath(name).name==name
         assert hashlib.sha256((r/name).read_bytes()).hexdigest()==expected,name
        print('VISUAL52_REPAIR120_ASSET_SEALS 89e8781cc47df7990612f9af5dc41f3fd535e3bc783ca237e480013463166669')
        PYSEALS
        status=0
        python3 "$REPAIR_ASSETS/integrity120.py" verify "$GITHUB_WORKSPACE/candidate" ${REPAIR_RUNTIME_PHASE:-tests} || status=1
        test "$status" = 0
    - name: Run compiler matrix type-tests
      if: always() && env.REPAIR_READY == 'true'
      working-directory: candidate
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYSEALS'
        import hashlib,json,os,pathlib
        r=pathlib.Path(os.environ['REPAIR_ASSETS']);raw=(r/'asset-seals.json').read_bytes()
        assert hashlib.sha256(raw).hexdigest()=='89e8781cc47df7990612f9af5dc41f3fd535e3bc783ca237e480013463166669'
        for name,expected in json.loads(raw).items():
         assert pathlib.PurePosixPath(name).name==name
         assert hashlib.sha256((r/name).read_bytes()).hexdigest()==expected,name
        print('VISUAL52_REPAIR120_ASSET_SEALS 89e8781cc47df7990612f9af5dc41f3fd535e3bc783ca237e480013463166669')
        PYSEALS
        status=0
        python3 "$REPAIR_ASSETS/integrity120.py" verify "$GITHUB_WORKSPACE/candidate" ${REPAIR_RUNTIME_PHASE:-tests} || status=1
        test "$status" = 0
        set -euo pipefail
        pnpm exec node "$REPAIR_ASSETS/compiler174.mjs" verify type-tests
        set +e
        pnpm test:types 2>&1 | tee "$RUNNER_TEMP/repair120/matrix-type-tests.log"
        status=${PIPESTATUS[0]}
        set -e
        echo "VISUAL52_REPAIR120_COMPILER_GATE type-tests $status"
        exit "$status"
    - name: Always verify runtime after Run compiler matrix type-tests
      if: always() && env.REPAIR_READY == 'true'
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYSEALS'
        import hashlib,json,os,pathlib
        r=pathlib.Path(os.environ['REPAIR_ASSETS']);raw=(r/'asset-seals.json').read_bytes()
        assert hashlib.sha256(raw).hexdigest()=='89e8781cc47df7990612f9af5dc41f3fd535e3bc783ca237e480013463166669'
        for name,expected in json.loads(raw).items():
         assert pathlib.PurePosixPath(name).name==name
         assert hashlib.sha256((r/name).read_bytes()).hexdigest()==expected,name
        print('VISUAL52_REPAIR120_ASSET_SEALS 89e8781cc47df7990612f9af5dc41f3fd535e3bc783ca237e480013463166669')
        PYSEALS
        status=0
        python3 "$REPAIR_ASSETS/integrity120.py" verify "$GITHUB_WORKSPACE/candidate" ${REPAIR_RUNTIME_PHASE:-tests} || status=1
        test "$status" = 0
    - name: Verify exact candidate matrix source and fixtures
      if: always() && env.REPAIR_READY == 'true'
      shell: bash
      run: |
        python3 "$RUNNER_TEMP/repair120/guard.py" verify candidate
    - name: Always final exact source fixture assets runtime and build guard
      if: always() && env.REPAIR_READY == 'true'
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYSEALS'
        import hashlib,json,os,pathlib
        r=pathlib.Path(os.environ['REPAIR_ASSETS']);raw=(r/'asset-seals.json').read_bytes()
        assert hashlib.sha256(raw).hexdigest()=='89e8781cc47df7990612f9af5dc41f3fd535e3bc783ca237e480013463166669'
        for name,expected in json.loads(raw).items():
         assert pathlib.PurePosixPath(name).name==name
         assert hashlib.sha256((r/name).read_bytes()).hexdigest()==expected,name
        print('VISUAL52_REPAIR120_ASSET_SEALS 89e8781cc47df7990612f9af5dc41f3fd535e3bc783ca237e480013463166669')
        PYSEALS
        status=0
        python3 "$REPAIR_ASSETS/integrity120.py" verify "$GITHUB_WORKSPACE/candidate" ${REPAIR_RUNTIME_PHASE:-tests} || status=1
        test "$status" = 0
    env:
      REPAIR_NODE_MAJOR: '24'
      REPAIR_COMPILER_VERSION: ${{ matrix.ts }}
      DEBUG: rolldown-plugin-dts:utils,rolldown-plugin-dts:tsgo
'on':
  workflow_dispatch: {}
  push:
    branches:
    - codex/verify-spring-matrix174
