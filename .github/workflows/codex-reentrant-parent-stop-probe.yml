name: visual52 review71 reentrant parent probe
on:
  workflow_dispatch:
  push:
    branches: [codex/verify-reentrant-parent-stop]
permissions:
  contents: read
jobs:
  native-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: pmndrs/react-spring
          ref: 83e476061290532ab517c4d4dfd60de21589e78e
          path: original
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: pmndrs/react-spring
          ref: 83e476061290532ab517c4d4dfd60de21589e78e
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.14.0
          run_install: false
      - name: Freeze exact original typed candidate and five fixture hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYASSETS'
          import base64,json,os,pathlib,zlib
          assets=json.loads(zlib.decompress(base64.b64decode('')))
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'review71';r.mkdir()
          for name,text in assets.items():(r/name).write_text(text)
          PYASSETS
          for repo in original candidate; do
            test "$(git -C "$repo" rev-parse HEAD)" = 83e476061290532ab517c4d4dfd60de21589e78e
            git -C "$repo" diff --exit-code
            git -C "$repo" diff --cached --exit-code
            cp "$RUNNER_TEMP/review71/frozen10.ts" "$repo/packages/core/src/visual52-native-before.test.ts"
            cp "$RUNNER_TEMP/review71/frozen3.ts" "$repo/packages/core/src/visual52-review58.test.ts"
            cp "$RUNNER_TEMP/review71/review71.ts" "$repo/packages/core/src/visual52-review71.test.ts"
          done
          cp "$RUNNER_TEMP/review71/typed23.ts" original/packages/core/src/scheduleProps.test.ts
          cp "$RUNNER_TEMP/review71/supplement22.ts" original/packages/core/src/Controller.stop.test.ts
          git -C candidate apply --check "$RUNNER_TEMP/review71/candidate.patch"
          git -C candidate apply "$RUNNER_TEMP/review71/candidate.patch"
          python3 "$RUNNER_TEMP/review71/guard.py" capture original
          python3 "$RUNNER_TEMP/review71/guard.py" capture candidate
          git -C candidate diff --check
          node --version
          pnpm --version
      - name: Install exact frozen native unit browser environments
        shell: bash
        run: |
          set -euo pipefail
          (cd original && pnpm install --frozen-lockfile)
          (cd candidate && pnpm install --frozen-lockfile)
          (cd candidate && pnpm exec playwright install --with-deps chromium)
      - name: Capture original immutable five-case native output before assessment
        working-directory: original
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm exec vitest run --project unit packages/core/src/visual52-review71.test.ts --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/review71/original.json" 2>&1 | tee "$RUNNER_TEMP/review71/original.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$RUNNER_TEMP/review71/original.status"
          echo "VISUAL52_REVIEW71_ORIGINAL_EXIT_STATUS $status"
          echo VISUAL52_REVIEW71_ORIGINAL_RAW_JSON_BEGIN
          if test -f "$RUNNER_TEMP/review71/original.json"; then
            cat "$RUNNER_TEMP/review71/original.json"
          else
            echo VISUAL52_REVIEW71_REPORT_MISSING
          fi
          echo VISUAL52_REVIEW71_ORIGINAL_RAW_JSON_END
          python3 "$RUNNER_TEMP/review71/receipt.py" original "$RUNNER_TEMP/review71" .
      - name: Capture candidate immutable five-case native output before assessment
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm exec vitest run --project unit packages/core/src/visual52-review71.test.ts --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/review71/candidate.json" 2>&1 | tee "$RUNNER_TEMP/review71/candidate.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$RUNNER_TEMP/review71/candidate.status"
          echo "VISUAL52_REVIEW71_CANDIDATE_EXIT_STATUS $status"
          echo VISUAL52_REVIEW71_CANDIDATE_RAW_JSON_BEGIN
          if test -f "$RUNNER_TEMP/review71/candidate.json"; then
            cat "$RUNNER_TEMP/review71/candidate.json"
          else
            echo VISUAL52_REVIEW71_REPORT_MISSING
          fi
          echo VISUAL52_REVIEW71_CANDIDATE_RAW_JSON_END
          python3 "$RUNNER_TEMP/review71/receipt.py" candidate "$RUNNER_TEMP/review71" .
      - name: Require controls and complete output without assuming diagnostic outcomes
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/review71/assess.py" "$RUNNER_TEMP/review71"
      - name: Verify all tracked source index trees manifest and immutable fixtures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/review71/guard.py" verify original
          python3 "$RUNNER_TEMP/review71/guard.py" verify candidate
          echo VISUAL52_REVIEW71_ALL_SOURCE_FIXTURE_GUARDS_PASS
