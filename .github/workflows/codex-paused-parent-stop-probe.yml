name: visual52 review58 paused parent probe
on:
  workflow_dispatch:
  push:
    branches: [codex/probe-paused-parent-stop]
permissions:
  contents: read
jobs:
  native-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: pmndrs/react-spring
          ref: 83e476061290532ab517c4d4dfd60de21589e78e
          path: original
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: pmndrs/react-spring
          ref: 83e476061290532ab517c4d4dfd60de21589e78e
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.14.0
          run_install: false
      - name: Freeze exact source and all three test fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYASSETS'
          import base64,json,os,pathlib,zlib
          assets=json.loads(zlib.decompress(base64.b64decode('')))
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'review58';r.mkdir()
          for name,text in assets.items():(r/name).write_text(text)
          PYASSETS
          for repo in original candidate; do
            test "$(git -C "$repo" rev-parse HEAD)" = 83e476061290532ab517c4d4dfd60de21589e78e
            git -C "$repo" diff --exit-code
            git -C "$repo" diff --cached --exit-code
            cp "$RUNNER_TEMP/review58/frozen10.ts" "$repo/packages/core/src/visual52-native-before.test.ts"
            cp "$RUNNER_TEMP/review58/review58.ts" "$repo/packages/core/src/visual52-review58.test.ts"
          done
          cp "$RUNNER_TEMP/review58/permanent23.ts" original/packages/core/src/scheduleProps.test.ts
          git -C candidate apply --check "$RUNNER_TEMP/review58/candidate.patch"
          git -C candidate apply "$RUNNER_TEMP/review58/candidate.patch"
          python3 "$RUNNER_TEMP/review58/guard.py" capture original
          python3 "$RUNNER_TEMP/review58/guard.py" capture candidate
          git -C candidate diff --check
          node --version
          pnpm --version
      - name: Install exact frozen locks and official browser environment
        shell: bash
        run: |
          set -euo pipefail
          (cd original && pnpm install --frozen-lockfile)
          (cd candidate && pnpm install --frozen-lockfile)
          (cd candidate && pnpm exec playwright install --with-deps chromium)
      - name: Capture original three-case native output before assessment
        working-directory: original
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm exec vitest run --project unit packages/core/src/visual52-review58.test.ts --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/review58/original.json" 2>&1 | tee "$RUNNER_TEMP/review58/original.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$RUNNER_TEMP/review58/original.status"
          echo "VISUAL52_REVIEW58_ORIGINAL_EXIT_STATUS $status"
          echo VISUAL52_REVIEW58_ORIGINAL_RAW_JSON_BEGIN
          if test -f "$RUNNER_TEMP/review58/original.json"; then
            cat "$RUNNER_TEMP/review58/original.json"
          else
            echo VISUAL52_REVIEW58_REPORT_MISSING
          fi
          echo VISUAL52_REVIEW58_ORIGINAL_RAW_JSON_END
      - name: Capture candidate three-case native output before assessment
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm exec vitest run --project unit packages/core/src/visual52-review58.test.ts --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/review58/candidate.json" 2>&1 | tee "$RUNNER_TEMP/review58/candidate.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$RUNNER_TEMP/review58/candidate.status"
          echo "VISUAL52_REVIEW58_CANDIDATE_EXIT_STATUS $status"
          echo VISUAL52_REVIEW58_CANDIDATE_RAW_JSON_BEGIN
          if test -f "$RUNNER_TEMP/review58/candidate.json"; then
            cat "$RUNNER_TEMP/review58/candidate.json"
          else
            echo VISUAL52_REVIEW58_REPORT_MISSING
          fi
          echo VISUAL52_REVIEW58_CANDIDATE_RAW_JSON_END
      - name: Assess experiment completeness without assuming pass or fail pattern
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/review58/assess.py" "$RUNNER_TEMP/review58"
      - name: Require original candidate source index trees and fixtures unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/review58/guard.py" verify original
          python3 "$RUNNER_TEMP/review58/guard.py" verify candidate
          echo VISUAL52_REVIEW58_ALL_SOURCE_FIXTURE_GUARDS_PASS
