          echo VISUAL52_REPAIR96_ONPROPS48_RAW_JSON_END
          test "$status" = 0
          python3 "$RUNNER_TEMP/repair96/verify.py" onprops48 "$RUNNER_TEMP/repair96/onprops48.json" "$RUNNER_TEMP/repair96/onprops48.log"
      - name: Require unchanged ten-case fixture all GREEN
        if: always()
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm exec vitest run --project unit packages/core/src/visual52-native-before.test.ts --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/repair96/green10.json" 2>&1 | tee "$RUNNER_TEMP/repair96/green10.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "VISUAL52_REPAIR96_GREEN10_EXIT_STATUS $status"
          echo VISUAL52_REPAIR96_GREEN10_RAW_JSON_BEGIN
          cat "$RUNNER_TEMP/repair96/green10.json"
          echo VISUAL52_REPAIR96_GREEN10_RAW_JSON_END
          test "$status" = 0
          python3 "$RUNNER_TEMP/repair96/verify10.py" "$RUNNER_TEMP/repair96/green10.json" "$RUNNER_TEMP/repair96/green10.log"
      - name: Require unchanged held-parent fixture all GREEN with exact flags
        if: always()
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm exec vitest run --project unit packages/core/src/visual52-review58.test.ts --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/repair96/green3.json" 2>&1 | tee "$RUNNER_TEMP/repair96/green3.log"
          status=${PIPESTATUS[0]}
          set -e
