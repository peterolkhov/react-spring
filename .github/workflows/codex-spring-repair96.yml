name: visual52 repair96 native AFTER
on:
  workflow_dispatch:
  push:
    branches: [codex/verify-spring-repair96]
permissions:
  contents: read
jobs:
  native-after:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: pmndrs/react-spring
          ref: 83e476061290532ab517c4d4dfd60de21589e78e
          path: original
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: pmndrs/react-spring
          ref: 83e476061290532ab517c4d4dfd60de21589e78e
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.14.0
          run_install: false
      - name: Stage sealed native payload part 1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCHUNK'
          import os,pathlib
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'repair96';r.mkdir(exist_ok=True)
          (r/'payload.b64').write_text('')
          PYCHUNK
      - name: Stage sealed native payload part 2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCHUNK'
          import os,pathlib
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'repair96';r.mkdir(exist_ok=True)
          with (r/'payload.b64').open('a') as f:f.write('')
          PYCHUNK
      - name: Stage sealed native payload part 3
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCHUNK'
          import os,pathlib
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'repair96';r.mkdir(exist_ok=True)
          with (r/'payload.b64').open('a') as f:f.write('')
          PYCHUNK
      - name: Stage sealed native payload part 4
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCHUNK'
          import os,pathlib
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'repair96';r.mkdir(exist_ok=True)
          with (r/'payload.b64').open('a') as f:f.write('')
          PYCHUNK
      - name: Stage sealed native payload part 5
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCHUNK'
          import os,pathlib
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'repair96';r.mkdir(exist_ok=True)
          with (r/'payload.b64').open('a') as f:f.write('')
          PYCHUNK
      - name: Unpack sealed native assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYASSETS'
          import base64,hashlib,json,os,pathlib,zlib
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'repair96'
          assets=json.loads(zlib.decompress(base64.b64decode((r/'payload.b64').read_text(),validate=True)))
          seals=json.loads(assets['asset-seals.json'])
          assert set(assets)==set(seals)|{'asset-seals.json'}
          for name,text in assets.items():
              assert pathlib.PurePosixPath(name).name==name
              if name in seals:assert hashlib.sha256(text.encode()).hexdigest()==seals[name],name
              (r/name).write_text(text)
          print('VISUAL52_REPAIR96_ASSET_SEALS '+json.dumps(seals,sort_keys=True))
          PYASSETS
      - name: Freeze source and all sealed regression fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYSEALS'
          import hashlib,os,pathlib
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'repair96'
          old=(r/'permanent23-before-types.ts').read_text()
          new=(r/'permanent23.ts').read_text()
          assert hashlib.sha256(old.encode()).hexdigest()=='997296f3d5103c9248097fed84a9f30c92e50746a413dbc4edac88fc3355b1d8'
          assert hashlib.sha256(new.encode()).hexdigest()=='a96b1d52c3d7f7096413995909e146cca8c0fd9020775de5d8bb1d2bf2827f84'
          inverse=new
          for name in ['a','b']:
              typed='const '+name+' = new Controller<{ x: number }>({ x: 0 })'
              plain='const '+name+' = new Controller({ x: 0 })'
              assert inverse.count(typed)==1
              inverse=inverse.replace(typed,plain,1)
          assert inverse==old
          print('VISUAL52_REPAIR96_TYPE_ONLY_INVERSE_BYTE_PROOF assertions_and_inputs_unchanged')
          PYSEALS
          for repo in original candidate; do
            test "$(git -C "$repo" rev-parse HEAD)" = 83e476061290532ab517c4d4dfd60de21589e78e
            git -C "$repo" diff --exit-code
            git -C "$repo" diff --cached --exit-code
            cp "$RUNNER_TEMP/repair96/frozen10.ts" "$repo/packages/core/src/visual52-native-before.test.ts"
            cp "$RUNNER_TEMP/repair96/frozen3.ts" "$repo/packages/core/src/visual52-review58.test.ts"
            cp "$RUNNER_TEMP/repair96/frozen5.ts" "$repo/packages/core/src/visual52-review71.test.ts"
            cp "$RUNNER_TEMP/repair96/frozen6.ts" "$repo/packages/core/src/visual52-review83.test.ts"
          done
          cp "$RUNNER_TEMP/repair96/permanent23.ts" original/packages/core/src/scheduleProps.test.ts
          cp "$RUNNER_TEMP/repair96/supplement22.ts" original/packages/core/src/Controller.stop.test.ts
          cp "$RUNNER_TEMP/repair96/reentrant12.ts" original/packages/core/src/Controller.reentrant.test.ts
          cp "$RUNNER_TEMP/repair96/onprops48.ts" original/packages/core/src/Controller.onProps.test.ts
          git -C candidate apply --check "$RUNNER_TEMP/repair96/candidate.patch"
          git -C candidate apply "$RUNNER_TEMP/repair96/candidate.patch"
          python3 "$RUNNER_TEMP/repair96/guard.py" capture original
          python3 "$RUNNER_TEMP/repair96/guard.py" capture candidate
          git -C candidate diff --check
          git -C candidate grep -n -E 'scheduleProps\(|stopAsync\(|RunAsyncState|resumeQueue.add' -- packages/core/src
          node --version
          pnpm --version
      - name: Install frozen native workspaces and official Chromium
        shell: bash
        run: |
          set -euo pipefail
          (cd original && pnpm install --frozen-lockfile)
          (cd candidate && pnpm install --frozen-lockfile)
          (cd candidate && pnpm exec playwright install --with-deps chromium)
      - name: Require unchanged original ten-case four RED six controls
        if: always()
        working-directory: original
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm exec vitest run --project unit packages/core/src/visual52-native-before.test.ts --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/repair96/original10.json" 2>&1 | tee "$RUNNER_TEMP/repair96/original10.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "VISUAL52_REPAIR96_ORIGINAL10_EXIT_STATUS $status"
          echo VISUAL52_REPAIR96_ORIGINAL10_RAW_JSON_BEGIN
          cat "$RUNNER_TEMP/repair96/original10.json"
          echo VISUAL52_REPAIR96_ORIGINAL10_RAW_JSON_END
          test "$status" = 1
          python3 "$RUNNER_TEMP/repair96/verify.py" original10 "$RUNNER_TEMP/repair96/original10.json" "$RUNNER_TEMP/repair96/original10.log"
      - name: Require held-parent original two RED one control
        if: always()
        working-directory: original
