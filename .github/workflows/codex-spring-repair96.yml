          echo VISUAL52_REPAIR96_PERMANENT-RED_RAW_JSON_BEGIN
          cat "$RUNNER_TEMP/repair96/permanent-red.json"
          echo VISUAL52_REPAIR96_PERMANENT-RED_RAW_JSON_END
          test "$status" = 1
          python3 "$RUNNER_TEMP/repair96/verify.py" permanent-red "$RUNNER_TEMP/repair96/permanent-red.json" "$RUNNER_TEMP/repair96/permanent-red.log"
      - name: Require new permanent reentrant regressions RED on original
        if: always()
        working-directory: original
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm exec vitest run --project unit packages/core/src/Controller.reentrant.test.ts -t 'settles a pause callback stop before a later resume' --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/repair96/reentrant-red.json" 2>&1 | tee "$RUNNER_TEMP/repair96/reentrant-red.log"
          status=${PIPESTATUS[0]}
