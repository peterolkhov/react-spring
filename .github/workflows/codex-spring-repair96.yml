          echo VISUAL52_REPAIR96_GREEN6_RAW_JSON_BEGIN
          cat "$RUNNER_TEMP/repair96/green6.json"
          echo VISUAL52_REPAIR96_GREEN6_RAW_JSON_END
          test "$status" = 0
          python3 "$RUNNER_TEMP/repair96/verify.py" green6 "$RUNNER_TEMP/repair96/green6.json" "$RUNNER_TEMP/repair96/green6.log"
      - name: Require permanent onProps ownership forty-eight cases GREEN
        if: always()
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm exec vitest run --project unit packages/core/src/Controller.onProps.test.ts --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/repair96/onprops48.json" 2>&1 | tee "$RUNNER_TEMP/repair96/onprops48.log"
