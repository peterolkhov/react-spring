          echo VISUAL52_REPAIR96_ORIGINAL6_RAW_JSON_BEGIN
          cat "$RUNNER_TEMP/repair96/original6.json"
          echo VISUAL52_REPAIR96_ORIGINAL6_RAW_JSON_END
          test "$status" = 1
          python3 "$RUNNER_TEMP/repair96/verify.py" original6 "$RUNNER_TEMP/repair96/original6.json" "$RUNNER_TEMP/repair96/original6.log"
      - name: Require new permanent onProps original four RED
        if: always()
        working-directory: original
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm exec vitest run --project unit packages/core/src/Controller.onProps.test.ts -t 'current child without starting its goal' --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/repair96/onprops-red.json" 2>&1 | tee "$RUNNER_TEMP/repair96/onprops-red.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "VISUAL52_REPAIR96_ONPROPS-RED_EXIT_STATUS $status"
          echo VISUAL52_REPAIR96_ONPROPS-RED_RAW_JSON_BEGIN
          cat "$RUNNER_TEMP/repair96/onprops-red.json"
          echo VISUAL52_REPAIR96_ONPROPS-RED_RAW_JSON_END
          test "$status" = 1
          python3 "$RUNNER_TEMP/repair96/verify.py" onprops-red "$RUNNER_TEMP/repair96/onprops-red.json" "$RUNNER_TEMP/repair96/onprops-red.log"
      - name: Require current-child frozen six-case fixture GREEN
        if: always()
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm exec vitest run --project unit packages/core/src/visual52-review83.test.ts --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/repair96/green6.json" 2>&1 | tee "$RUNNER_TEMP/repair96/green6.log"
          status=${PIPESTATUS[0]}
