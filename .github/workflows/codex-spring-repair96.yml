      - name: Require supplemental 22 lifecycle and result controls GREEN
        if: always()
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm exec vitest run --project unit packages/core/src/Controller.stop.test.ts --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/repair96/supplement22.json" 2>&1 | tee "$RUNNER_TEMP/repair96/supplement22.log"
