        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm exec vitest run --project unit packages/core/src/visual52-review71.test.ts --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/repair96/green5.json" 2>&1 | tee "$RUNNER_TEMP/repair96/green5.log"
