          python3 "$RUNNER_TEMP/repair96/verify.py" reentrant-red "$RUNNER_TEMP/repair96/reentrant-red.json" "$RUNNER_TEMP/repair96/reentrant-red.log"
      - name: Require current-child original four RED two controls
        if: always()
        working-directory: original
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm exec vitest run --project unit packages/core/src/visual52-review83.test.ts --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/repair96/original6.json" 2>&1 | tee "$RUNNER_TEMP/repair96/original6.log"
          status=${PIPESTATUS[0]}
          set -e
