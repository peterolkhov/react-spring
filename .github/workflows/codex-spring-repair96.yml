          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.14.0
          run_install: false
      - name: Stage sealed matrix assets part 1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCHUNK'
          import os,pathlib
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'repair96';r.mkdir(exist_ok=True)
          (r/'payload.b64').write_text('')
          PYCHUNK
      - name: Stage sealed matrix assets part 2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCHUNK'
          import os,pathlib
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'repair96';r.mkdir(exist_ok=True)
          with (r/'payload.b64').open('a') as f:f.write('')
          PYCHUNK
      - name: Stage sealed matrix assets part 3
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCHUNK'
          import os,pathlib
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'repair96';r.mkdir(exist_ok=True)
          with (r/'payload.b64').open('a') as f:f.write('')
          PYCHUNK
      - name: Stage sealed matrix assets part 4
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCHUNK'
          import os,pathlib
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'repair96';r.mkdir(exist_ok=True)
          with (r/'payload.b64').open('a') as f:f.write('')
          PYCHUNK
      - name: Stage sealed matrix assets part 5
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCHUNK'
          import os,pathlib
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'repair96';r.mkdir(exist_ok=True)
          with (r/'payload.b64').open('a') as f:f.write('')
          PYCHUNK
      - name: Prepare and freeze exact candidate matrix source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYASSETS'
          import base64,hashlib,json,os,pathlib,zlib
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'repair96'
          assets=json.loads(zlib.decompress(base64.b64decode((r/'payload.b64').read_text(),validate=True)))
          seals=json.loads(assets['asset-seals.json'])
          assert set(assets)==set(seals)|{'asset-seals.json'}
          for name,text in assets.items():
              assert pathlib.PurePosixPath(name).name==name
              if name in seals:assert hashlib.sha256(text.encode()).hexdigest()==seals[name],name
              (r/name).write_text(text)
          PYASSETS
          cp "$RUNNER_TEMP/repair96/frozen10.ts" candidate/packages/core/src/visual52-native-before.test.ts
          cp "$RUNNER_TEMP/repair96/frozen3.ts" candidate/packages/core/src/visual52-review58.test.ts
          cp "$RUNNER_TEMP/repair96/frozen5.ts" candidate/packages/core/src/visual52-review71.test.ts
          cp "$RUNNER_TEMP/repair96/frozen6.ts" candidate/packages/core/src/visual52-review83.test.ts
          git -C candidate apply --check "$RUNNER_TEMP/repair96/candidate.patch"
          git -C candidate apply "$RUNNER_TEMP/repair96/candidate.patch"
          python3 "$RUNNER_TEMP/repair96/guard.py" capture candidate
      - name: Install exact frozen candidate dependencies
        working-directory: candidate
        shell: bash
        run: |
          pnpm install --frozen-lockfile
      - name: Install official Chromium
        working-directory: candidate
        shell: bash
        run: |
          pnpm exec playwright install --with-deps chromium
      - name: Run complete official Node22 Chromium unit suite
        if: always()
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm exec vitest run --project unit  --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/repair96/full-node22.json" 2>&1 | tee "$RUNNER_TEMP/repair96/full-node22.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "VISUAL52_REPAIR96_FULL-NODE22_EXIT_STATUS $status"
          echo VISUAL52_REPAIR96_FULL-NODE22_RAW_JSON_BEGIN
          cat "$RUNNER_TEMP/repair96/full-node22.json"
          echo VISUAL52_REPAIR96_FULL-NODE22_RAW_JSON_END
          test "$status" = 0
          python3 "$RUNNER_TEMP/repair96/verify.py" full-node22 "$RUNNER_TEMP/repair96/full-node22.json" "$RUNNER_TEMP/repair96/full-node22.log"
      - name: Verify exact candidate matrix source and fixtures
        if: always()
        shell: bash
        run: |
          python3 "$RUNNER_TEMP/repair96/guard.py" verify candidate
