        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm exec vitest run --project unit packages/core/src/Controller.reentrant.test.ts --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/repair96/reentrant12.json" 2>&1 | tee "$RUNNER_TEMP/repair96/reentrant12.log"
          status=${PIPESTATUS[0]}
