      - name: Check formatting without changing source
        if: always()
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYFORMAT'
          import json,os,pathlib,subprocess
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'repair96'
          files=[x['path'] for x in json.loads((r/'manifest.json').read_text())['files']]
          p=subprocess.run(['pnpm','exec','oxfmt','--check',*files])
          if p.returncode:
              import base64,shutil
              tmp=r/'formatted-copy';tmp.mkdir()
              for f in files:
                  p=tmp/f;p.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(f,p)
              subprocess.run(['pnpm','exec','oxfmt',*[str(tmp/f) for f in files]],check=True)
              for f in files:
                  if pathlib.Path(f).read_bytes()!=(tmp/f).read_bytes():
                      print('VISUAL52_REPAIR96_FORMATTED_COPY '+f+' '+base64.b64encode((tmp/f).read_bytes()).decode())
              raise SystemExit(1)
          PYFORMAT
      - name: Run complete native Chromium unit suite
        if: always()
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm exec vitest run --project unit  --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/repair96/full.json" 2>&1 | tee "$RUNNER_TEMP/repair96/full.log"
