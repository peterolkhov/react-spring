      - name: Require sealed permanent 23 cases GREEN
        if: always()
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm exec vitest run --project unit packages/core/src/scheduleProps.test.ts --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/repair96/permanent23.json" 2>&1 | tee "$RUNNER_TEMP/repair96/permanent23.log"
