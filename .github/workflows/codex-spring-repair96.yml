          echo VISUAL52_REPAIR96_ORIGINAL3_RAW_JSON_BEGIN
          cat "$RUNNER_TEMP/repair96/original3.json"
          echo VISUAL52_REPAIR96_ORIGINAL3_RAW_JSON_END
          test "$status" = 1
          python3 "$RUNNER_TEMP/repair96/verify.py" original3 "$RUNNER_TEMP/repair96/original3.json" "$RUNNER_TEMP/repair96/original3.log"
      - name: Require original immutable reentrant two RED three controls
        if: always()
        working-directory: original
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm exec vitest run --project unit packages/core/src/visual52-review71.test.ts --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/repair96/original5.json" 2>&1 | tee "$RUNNER_TEMP/repair96/original5.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "VISUAL52_REPAIR96_ORIGINAL5_EXIT_STATUS $status"
          echo VISUAL52_REPAIR96_ORIGINAL5_RAW_JSON_BEGIN
          cat "$RUNNER_TEMP/repair96/original5.json"
          echo VISUAL52_REPAIR96_ORIGINAL5_RAW_JSON_END
          test "$status" = 1
          python3 "$RUNNER_TEMP/repair96/verify.py" original5 "$RUNNER_TEMP/repair96/original5.json" "$RUNNER_TEMP/repair96/original5.log"
      - name: Require original permanent four cancellation regressions RED
        if: always()
        working-directory: original
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm exec vitest run --project unit packages/core/src/scheduleProps.test.ts -t 'settles (delayed|paused) starts on stop\(true\)' --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/repair96/permanent-red.json" 2>&1 | tee "$RUNNER_TEMP/repair96/permanent-red.log"
          status=${PIPESTATUS[0]}
