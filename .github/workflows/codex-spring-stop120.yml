name: visual52 repair120 bounded native AFTER
permissions:
  contents: read
jobs:
  native-after:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: pmndrs/react-spring
        ref: 83e476061290532ab517c4d4dfd60de21589e78e
        path: original
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: pmndrs/react-spring
        ref: 83e476061290532ab517c4d4dfd60de21589e78e
        path: candidate
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.22.0
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      with:
        version: 12.14.0
        run_install: false
    - name: Define external frozen verification paths
      shell: bash
      run: |
        set -euo pipefail
        echo "REPAIR_ASSETS=$RUNNER_TEMP/repair120" >> "$GITHUB_ENV"
        echo "REPAIR_RESULTS=$RUNNER_TEMP/repair120/results" >> "$GITHUB_ENV"
    - name: Stage sealed immutable payload part 1
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYCHUNK'
        import os,pathlib
        r=pathlib.Path(os.environ['REPAIR_ASSETS']);r.mkdir(exist_ok=True)
        (r/'payload.b64').write_text('')
        PYCHUNK
    - name: Stage sealed immutable payload part 2
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYCHUNK'
        import os,pathlib
        r=pathlib.Path(os.environ['REPAIR_ASSETS']);r.mkdir(exist_ok=True)
        with (r/'payload.b64').open('a') as stream:stream.write('')
        PYCHUNK
    - name: Stage sealed immutable payload part 3
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYCHUNK'
        import os,pathlib
        r=pathlib.Path(os.environ['REPAIR_ASSETS']);r.mkdir(exist_ok=True)
        with (r/'payload.b64').open('a') as stream:stream.write('')
        PYCHUNK
    - name: Stage sealed immutable payload part 4
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYCHUNK'
        import os,pathlib
        r=pathlib.Path(os.environ['REPAIR_ASSETS']);r.mkdir(exist_ok=True)
        with (r/'payload.b64').open('a') as stream:stream.write('')
        PYCHUNK
    - name: Stage sealed immutable payload part 5
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYCHUNK'
        import os,pathlib
        r=pathlib.Path(os.environ['REPAIR_ASSETS']);r.mkdir(exist_ok=True)
        with (r/'payload.b64').open('a') as stream:stream.write('')
        PYCHUNK
    - name: Stage sealed immutable payload part 6
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYCHUNK'
        import os,pathlib
        r=pathlib.Path(os.environ['REPAIR_ASSETS']);r.mkdir(exist_ok=True)
        with (r/'payload.b64').open('a') as stream:stream.write('')
        PYCHUNK
    - name: Unpack sealed native assets
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYASSETS'
        import base64,hashlib,json,os,pathlib,zlib
        r=pathlib.Path(os.environ['RUNNER_TEMP'])/'repair120'
        assets=json.loads(zlib.decompress(base64.b64decode((r/'payload.b64').read_text(),validate=True)))
        seals=json.loads(assets['asset-seals.json'])
        assert set(assets)==set(seals)|{'asset-seals.json'}
        for name,text in assets.items():
            assert pathlib.PurePosixPath(name).name==name
            if name in seals:assert hashlib.sha256(text.encode()).hexdigest()==seals[name],name
            (r/name).write_text(text)
        print('VISUAL52_REPAIR120_ASSET_SEALS '+json.dumps(seals,sort_keys=True))
        PYASSETS
    - name: Freeze source and all sealed regression fixtures
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PYSEALS'
        import hashlib,os,pathlib
        r=pathlib.Path(os.environ['RUNNER_TEMP'])/'repair120'
        old=(r/'permanent23-before-types.ts').read_text()
        new=(r/'permanent23.ts').read_text()
        assert hashlib.sha256(old.encode()).hexdigest()=='997296f3d5103c9248097fed84a9f30c92e50746a413dbc4edac88fc3355b1d8'
        assert hashlib.sha256(new.encode()).hexdigest()=='a96b1d52c3d7f7096413995909e146cca8c0fd9020775de5d8bb1d2bf2827f84'
        inverse=new
        for name in ['a','b']:
            typed='const '+name+' = new Controller<{ x: number }>({ x: 0 })'
            plain='const '+name+' = new Controller({ x: 0 })'
            assert inverse.count(typed)==1
            inverse=inverse.replace(typed,plain,1)
        assert inverse==old
        print('VISUAL52_REPAIR120_TYPE_ONLY_INVERSE_BYTE_PROOF assertions_and_inputs_unchanged')
        PYSEALS
        for repo in original candidate; do
          test "$(git -C "$repo" rev-parse HEAD)" = 83e476061290532ab517c4d4dfd60de21589e78e
          git -C "$repo" diff --exit-code
          git -C "$repo" diff --cached --exit-code
          cp "$RUNNER_TEMP/repair120/frozen10.ts" "$repo/packages/core/src/visual52-native-before.test.ts"
          cp "$RUNNER_TEMP/repair120/frozen3.ts" "$repo/packages/core/src/visual52-review58.test.ts"
          cp "$RUNNER_TEMP/repair120/frozen5.ts" "$repo/packages/core/src/visual52-review71.test.ts"
          cp "$RUNNER_TEMP/repair120/frozen6.ts" "$repo/packages/core/src/visual52-review83.test.ts"
          cp "$RUNNER_TEMP/repair120/review99.ts" "$repo/packages/core/src/visual52-review99.test.ts"
        done
        cp "$RUNNER_TEMP/repair120/permanent23.ts" original/packages/core/src/scheduleProps.test.ts
        cp "$RUNNER_TEMP/repair120/supplement22.ts" original/packages/core/src/Controller.stop.test.ts
        cp "$RUNNER_TEMP/repair120/reentrant12.ts" original/packages/core/src/Controller.reentrant.test.ts
        cp "$RUNNER_TEMP/repair120/onprops48.ts" original/packages/core/src/Controller.onProps.test.ts
        git -C candidate apply --check "$RUNNER_TEMP/repair120/candidate.patch"
        git -C candidate apply "$RUNNER_TEMP/repair120/candidate.patch"
        python3 "$RUNNER_TEMP/repair120/guard.py" capture original
        python3 "$RUNNER_TEMP/repair120/guard.py" capture candidate
        git -C candidate diff --check
        git -C candidate grep -n -E 'scheduleProps\(|stopAsync\(|RunAsyncState|resumeQueue.add' -- packages/core/src
        node --version
        pnpm --version
    - name: Install frozen native workspaces and official Chromium
      shell: bash
      run: |
        set -euo pipefail
        (cd original && pnpm install --frozen-lockfile)
        (cd candidate && pnpm install --frozen-lockfile)
        (cd candidate && pnpm exec playwright install --with-deps chromium)
    - name: Warm blank Chromium before baseline as declared setup only
      working-directory: candidate
      shell: bash
      run: |
        set -euo pipefail
        echo 'VISUAL52_REPAIR120_SETUP blank Chromium warmup before baseline; no claim about prior runtime delta cause'
        pnpm exec node --input-type=module -e 'import { chromium } from "playwright"; const browser = await chromium.launch(); const page = await browser.newPage(); await page.goto("about:blank"); await browser.close();'
