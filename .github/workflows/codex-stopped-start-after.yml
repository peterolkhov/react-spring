name: visual52 repair62 native AFTER
on:
  workflow_dispatch:
  push:
    branches: [codex/validate-stopped-start-lifetimes]
permissions:
  contents: read
jobs:
  native-after:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: pmndrs/react-spring
          ref: 83e476061290532ab517c4d4dfd60de21589e78e
          path: original
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: pmndrs/react-spring
          ref: 83e476061290532ab517c4d4dfd60de21589e78e
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.14.0
          run_install: false
      - name: Freeze source and preserve all three existing regression fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYASSETS'
          import base64,json,os,pathlib,zlib
          assets=json.loads(zlib.decompress(base64.b64decode('')))
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'repair62';r.mkdir()
          for name,text in assets.items():(r/name).write_text(text)
          PYASSETS
          for repo in original candidate; do
            test "$(git -C "$repo" rev-parse HEAD)" = 83e476061290532ab517c4d4dfd60de21589e78e
            git -C "$repo" diff --exit-code
            git -C "$repo" diff --cached --exit-code
            cp "$RUNNER_TEMP/repair62/frozen10.ts" "$repo/packages/core/src/visual52-native-before.test.ts"
            cp "$RUNNER_TEMP/repair62/frozen3.ts" "$repo/packages/core/src/visual52-review58.test.ts"
          done
          cp "$RUNNER_TEMP/repair62/permanent23.ts" original/packages/core/src/scheduleProps.test.ts
          git -C candidate apply --check "$RUNNER_TEMP/repair62/candidate.patch"
          git -C candidate apply "$RUNNER_TEMP/repair62/candidate.patch"
          python3 "$RUNNER_TEMP/repair62/guard.py" capture original
          python3 "$RUNNER_TEMP/repair62/guard.py" capture candidate
          git -C candidate diff --check
          git -C candidate grep -n -E 'scheduleProps\(|stopAsync\(|RunAsyncState|resumeQueue.add' -- packages/core/src
          node --version
          pnpm --version
      - name: Install frozen native workspaces and official Chromium
        shell: bash
        run: |
          set -euo pipefail
          (cd original && pnpm install --frozen-lockfile)
          (cd candidate && pnpm install --frozen-lockfile)
          (cd candidate && pnpm exec playwright install --with-deps chromium)
      - name: Require unchanged original ten-case four RED six controls
        working-directory: original
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm exec vitest run --project unit packages/core/src/visual52-native-before.test.ts --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/repair62/original10.json" 2>&1 | tee "$RUNNER_TEMP/repair62/original10.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "VISUAL52_REPAIR62_ORIGINAL10_EXIT_STATUS $status"
          echo VISUAL52_REPAIR62_ORIGINAL10_RAW_JSON_BEGIN
          cat "$RUNNER_TEMP/repair62/original10.json"
          echo VISUAL52_REPAIR62_ORIGINAL10_RAW_JSON_END
          test "$status" = 1
          python3 "$RUNNER_TEMP/repair62/verify.py" original10 "$RUNNER_TEMP/repair62/original10.json" "$RUNNER_TEMP/repair62/original10.log"
      - name: Require held-parent original two RED one control
        working-directory: original
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm exec vitest run --project unit packages/core/src/visual52-review58.test.ts --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/repair62/original3.json" 2>&1 | tee "$RUNNER_TEMP/repair62/original3.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "VISUAL52_REPAIR62_ORIGINAL3_EXIT_STATUS $status"
          echo VISUAL52_REPAIR62_ORIGINAL3_RAW_JSON_BEGIN
          cat "$RUNNER_TEMP/repair62/original3.json"
          echo VISUAL52_REPAIR62_ORIGINAL3_RAW_JSON_END
          test "$status" = 1
          python3 "$RUNNER_TEMP/repair62/verify.py" original3 "$RUNNER_TEMP/repair62/original3.json" "$RUNNER_TEMP/repair62/original3.log"
      - name: Require original permanent four cancellation regressions RED
        working-directory: original
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm exec vitest run --project unit packages/core/src/scheduleProps.test.ts -t 'settles (delayed|paused) starts on stop\(true\)' --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/repair62/permanent-red.json" 2>&1 | tee "$RUNNER_TEMP/repair62/permanent-red.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "VISUAL52_REPAIR62_PERMANENT-RED_EXIT_STATUS $status"
          echo VISUAL52_REPAIR62_PERMANENT-RED_RAW_JSON_BEGIN
          cat "$RUNNER_TEMP/repair62/permanent-red.json"
          echo VISUAL52_REPAIR62_PERMANENT-RED_RAW_JSON_END
          test "$status" = 1
          python3 "$RUNNER_TEMP/repair62/verify.py" permanent-red "$RUNNER_TEMP/repair62/permanent-red.json" "$RUNNER_TEMP/repair62/permanent-red.log"
      - name: Require unchanged ten-case fixture all GREEN
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm exec vitest run --project unit packages/core/src/visual52-native-before.test.ts --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/repair62/green10.json" 2>&1 | tee "$RUNNER_TEMP/repair62/green10.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "VISUAL52_REPAIR62_GREEN10_EXIT_STATUS $status"
          echo VISUAL52_REPAIR62_GREEN10_RAW_JSON_BEGIN
          cat "$RUNNER_TEMP/repair62/green10.json"
          echo VISUAL52_REPAIR62_GREEN10_RAW_JSON_END
          test "$status" = 0
          python3 "$RUNNER_TEMP/repair62/verify10.py" "$RUNNER_TEMP/repair62/green10.json" "$RUNNER_TEMP/repair62/green10.log"
      - name: Require unchanged held-parent fixture all GREEN with exact flags
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm exec vitest run --project unit packages/core/src/visual52-review58.test.ts --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/repair62/green3.json" 2>&1 | tee "$RUNNER_TEMP/repair62/green3.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "VISUAL52_REPAIR62_GREEN3_EXIT_STATUS $status"
          echo VISUAL52_REPAIR62_GREEN3_RAW_JSON_BEGIN
          cat "$RUNNER_TEMP/repair62/green3.json"
          echo VISUAL52_REPAIR62_GREEN3_RAW_JSON_END
          test "$status" = 0
          python3 "$RUNNER_TEMP/repair62/verify.py" green3 "$RUNNER_TEMP/repair62/green3.json" "$RUNNER_TEMP/repair62/green3.log"
      - name: Require original permanent 23 cases GREEN
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm exec vitest run --project unit packages/core/src/scheduleProps.test.ts --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/repair62/permanent23.json" 2>&1 | tee "$RUNNER_TEMP/repair62/permanent23.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "VISUAL52_REPAIR62_PERMANENT23_EXIT_STATUS $status"
          echo VISUAL52_REPAIR62_PERMANENT23_RAW_JSON_BEGIN
          cat "$RUNNER_TEMP/repair62/permanent23.json"
          echo VISUAL52_REPAIR62_PERMANENT23_RAW_JSON_END
          test "$status" = 0
          python3 "$RUNNER_TEMP/repair62/verify.py" permanent23 "$RUNNER_TEMP/repair62/permanent23.json" "$RUNNER_TEMP/repair62/permanent23.log"
      - name: Require supplemental 14 lifecycle and result controls GREEN
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm exec vitest run --project unit packages/core/src/Controller.stop.test.ts --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/repair62/supplement14.json" 2>&1 | tee "$RUNNER_TEMP/repair62/supplement14.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "VISUAL52_REPAIR62_SUPPLEMENT14_EXIT_STATUS $status"
          echo VISUAL52_REPAIR62_SUPPLEMENT14_RAW_JSON_BEGIN
          cat "$RUNNER_TEMP/repair62/supplement14.json"
          echo VISUAL52_REPAIR62_SUPPLEMENT14_RAW_JSON_END
          test "$status" = 0
          python3 "$RUNNER_TEMP/repair62/verify.py" supplement14 "$RUNNER_TEMP/repair62/supplement14.json" "$RUNNER_TEMP/repair62/supplement14.log"
      - name: Check formatting without changing source
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYFORMAT'
          import json,os,pathlib,subprocess
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'repair62'
          files=[x['path'] for x in json.loads((r/'manifest.json').read_text())['files']]
          p=subprocess.run(['pnpm','exec','oxfmt','--check',*files])
          if p.returncode:
              import base64,shutil
              tmp=r/'formatted-copy';tmp.mkdir()
              for f in files:
                  p=tmp/f;p.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(f,p)
              subprocess.run(['pnpm','exec','oxfmt',*[str(tmp/f) for f in files]],check=True)
              for f in files:
                  if pathlib.Path(f).read_bytes()!=(tmp/f).read_bytes():
                      print('VISUAL52_REPAIR62_FORMATTED_COPY '+f+' '+base64.b64encode((tmp/f).read_bytes()).decode())
              raise SystemExit(1)
          PYFORMAT
      - name: Run complete native Chromium unit suite
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm exec vitest run --project unit  --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/repair62/full.json" 2>&1 | tee "$RUNNER_TEMP/repair62/full.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "VISUAL52_REPAIR62_FULL_EXIT_STATUS $status"
          echo VISUAL52_REPAIR62_FULL_RAW_JSON_BEGIN
          cat "$RUNNER_TEMP/repair62/full.json"
          echo VISUAL52_REPAIR62_FULL_RAW_JSON_END
          test "$status" = 0
          python3 "$RUNNER_TEMP/repair62/verify.py" full "$RUNNER_TEMP/repair62/full.json" "$RUNNER_TEMP/repair62/full.log"
      - name: Run official build repo type type-test and E2E gates
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          pnpm build-ci
          pnpm check:types
          pnpm test:types
          pnpm test:e2e
      - name: Run official whole-repo lint and format checks
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          # Both diagnostic fixtures log snapshots; preserve their exact bytes outside globs.
          mv packages/core/src/visual52-native-before.test.ts "$RUNNER_TEMP/repair62/frozen10-outside.ts"
          mv packages/core/src/visual52-review58.test.ts "$RUNNER_TEMP/repair62/frozen3-outside.ts"
          trap 'mv "$RUNNER_TEMP/repair62/frozen10-outside.ts" packages/core/src/visual52-native-before.test.ts; mv "$RUNNER_TEMP/repair62/frozen3-outside.ts" packages/core/src/visual52-review58.test.ts' EXIT
          pnpm lint
          pnpm format:check
      - name: Verify complete source index tree HEAD and all frozen fixtures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f "$RUNNER_TEMP/repair62/frozen10-outside.ts"; then
            mv "$RUNNER_TEMP/repair62/frozen10-outside.ts" candidate/packages/core/src/visual52-native-before.test.ts
          fi
          if test -f "$RUNNER_TEMP/repair62/frozen3-outside.ts"; then
            mv "$RUNNER_TEMP/repair62/frozen3-outside.ts" candidate/packages/core/src/visual52-review58.test.ts
          fi
          python3 "$RUNNER_TEMP/repair62/guard.py" verify original
          python3 "$RUNNER_TEMP/repair62/guard.py" verify candidate
          echo VISUAL52_REPAIR62_ALL_SOURCE_FIXTURE_GUARDS_PASS
