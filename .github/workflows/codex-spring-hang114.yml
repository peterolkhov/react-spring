      - name: Define external observer paths
        shell: bash
        run: |
          set -euo pipefail
          echo "OBSERVER_ASSETS=$RUNNER_TEMP/observer114" >> "$GITHUB_ENV"
          echo "OBSERVER_RESULTS=$RUNNER_TEMP/observer114/results" >> "$GITHUB_ENV"
      - name: Stage immutable observer payload 1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCHUNK'
          import os,pathlib
          r=pathlib.Path(os.environ['OBSERVER_ASSETS']);r.mkdir(exist_ok=True)
          (r/'payload.b64').write_text('')
          PYCHUNK
      - name: Stage immutable observer payload 2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCHUNK'
          import os,pathlib
          r=pathlib.Path(os.environ['OBSERVER_ASSETS']);r.mkdir(exist_ok=True)
          with (r/'payload.b64').open('a') as f:f.write('')
          PYCHUNK
