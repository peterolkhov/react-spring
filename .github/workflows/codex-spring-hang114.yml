          python3 - <<'PYSEALS'
          import hashlib,json,os,pathlib
          r=pathlib.Path(os.environ['OBSERVER_ASSETS'])
          b=(r/'asset-seals.json').read_bytes()
          assert hashlib.sha256(b).hexdigest()=='ee78fafedb627c23d7272e2cbac992881b2228aa979149b2dbcca65e2abab1ef'
          for n,h in json.loads(b).items():
           assert pathlib.PurePosixPath(n).name==n
           assert hashlib.sha256((r/n).read_bytes()).hexdigest()==h,n
          print('VISUAL52_OBSERVER114_IMMUTABLE_ASSETS ee78fafedb627c23d7272e2cbac992881b2228aa979149b2dbcca65e2abab1ef')
          PYSEALS
          guard_status=0
          python3 "$OBSERVER_ASSETS/integrity114.py" capture "$GITHUB_WORKSPACE/original" || guard_status=1
          python3 "$OBSERVER_ASSETS/integrity114.py" capture "$GITHUB_WORKSPACE/candidate" || guard_status=1
          test "$guard_status" -eq 0
          echo 'OBSERVER_READY=true' >> "$GITHUB_ENV"
