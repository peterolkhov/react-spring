      - name: Unpack exact reviewed payload and stage frozen source states
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYUNPACK'
          import base64,hashlib,json,os,pathlib,zlib
          r=pathlib.Path(os.environ['OBSERVER_ASSETS'])
          raw=zlib.decompress(base64.b64decode((r/'payload.b64').read_text(),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='8ba25b3f3f58ac02fbf0f231fac612efb1fd7116548f23004fcc8ba785bded88'
          a=json.loads(raw);s=json.loads(a['asset-seals.json'])
          assert set(a)==set(s)|{'asset-seals.json'}
          assert hashlib.sha256(a['asset-seals.json'].encode()).hexdigest()=='ee78fafedb627c23d7272e2cbac992881b2228aa979149b2dbcca65e2abab1ef'
          for n,t in a.items():
           assert pathlib.PurePosixPath(n).name==n
           if n in s:assert hashlib.sha256(t.encode()).hexdigest()==s[n],n
           (r/n).write_text(t)
          print('VISUAL52_OBSERVER114_PAYLOAD_SHA256 8ba25b3f3f58ac02fbf0f231fac612efb1fd7116548f23004fcc8ba785bded88')
          print('VISUAL52_OBSERVER114_ASSET_SEALS '+json.dumps(s,sort_keys=True))
          for d in ['original','candidate']:
           root=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/d/'packages/core/src'
           for asset,target in [('frozen10.ts','visual52-native-before.test.ts'),('frozen3.ts','visual52-review58.test.ts'),('frozen5.ts','visual52-review71.test.ts'),('frozen6.ts','visual52-review83.test.ts'),('review99.ts','visual52-review99.test.ts')]:
            (root/target).write_text(a[asset])
           if d=='original':
            for asset,target in [('permanent23.ts','scheduleProps.test.ts'),('supplement22.ts','Controller.stop.test.ts'),('reentrant12.ts','Controller.reentrant.test.ts'),('onprops48.ts','Controller.onProps.test.ts')]:
             (root/target).write_text(a[asset])
          PYUNPACK
          git -C candidate apply --check "$OBSERVER_ASSETS/candidate.patch"
          git -C candidate apply "$OBSERVER_ASSETS/candidate.patch"
          python3 "$OBSERVER_ASSETS/guard.py" capture "$GITHUB_WORKSPACE/original"
          python3 "$OBSERVER_ASSETS/guard.py" capture "$GITHUB_WORKSPACE/candidate"
          echo 'OBSERVER_STAGED=true' >> "$GITHUB_ENV"
      - name: Install unchanged frozen dependencies and official Chromium
        shell: bash
        run: |
          set -euo pipefail
          node --version
