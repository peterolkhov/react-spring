name: visual52 frozen48 bounded lifecycle observer114
on:
  push:
    branches: [codex/observe-spring-hang114]
  workflow_dispatch:
    inputs:
      node22_full:
        description: Independently observe complete candidate units on Node22
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  frozen48-node24:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OBSERVER_NODE_MAJOR: '24'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
