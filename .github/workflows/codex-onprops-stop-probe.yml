name: visual52 review83 onProps stop probe
on:
  workflow_dispatch:
  push:
    branches: [codex/observe-onprops-stop]
permissions:
  contents: read
jobs:
  native-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: pmndrs/react-spring
          ref: 83e476061290532ab517c4d4dfd60de21589e78e
          path: original
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: pmndrs/react-spring
          ref: 83e476061290532ab517c4d4dfd60de21589e78e
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.14.0
          run_install: false
      - name: Stage sealed probe payload part 1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCHUNK'
          import os,pathlib
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'review83';r.mkdir(exist_ok=True)
          (r/'payload.b64').write_text('')
          PYCHUNK
      - name: Stage sealed probe payload part 2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCHUNK'
          import os,pathlib
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'review83';r.mkdir(exist_ok=True)
          with (r/'payload.b64').open('a') as f:f.write('')
          PYCHUNK
      - name: Unpack and verify all exact probe assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYASSETS'
          import base64,hashlib,json,os,pathlib,zlib
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'review83'
          assets=json.loads(zlib.decompress(base64.b64decode((r/'payload.b64').read_text(),validate=True)))
          seals=json.loads(assets['asset-seals.json'])
          assert set(assets)==set(seals)|{'asset-seals.json'}
          for name,text in assets.items():
              assert pathlib.PurePosixPath(name).name==name
              if name in seals:assert hashlib.sha256(text.encode()).hexdigest()==seals[name],name
              (r/name).write_text(text)
          print('VISUAL52_REVIEW83_ASSET_SEALS '+json.dumps(seals,sort_keys=True))
          PYASSETS
      - name: Freeze official whole source states and all six fixtures
        shell: bash
        run: |
          set -euo pipefail
          for repo in original candidate; do
            test "$(git -C "$repo" rev-parse HEAD)" = 83e476061290532ab517c4d4dfd60de21589e78e
            git -C "$repo" diff --exit-code
            git -C "$repo" diff --cached --exit-code
            cp "$RUNNER_TEMP/review83/frozen10.ts" "$repo/packages/core/src/visual52-native-before.test.ts"
            cp "$RUNNER_TEMP/review83/frozen3.ts" "$repo/packages/core/src/visual52-review58.test.ts"
            cp "$RUNNER_TEMP/review83/review71.ts" "$repo/packages/core/src/visual52-review71.test.ts"
            cp "$RUNNER_TEMP/review83/review83.ts" "$repo/packages/core/src/visual52-review83.test.ts"
          done
          cp "$RUNNER_TEMP/review83/typed23.ts" original/packages/core/src/scheduleProps.test.ts
          cp "$RUNNER_TEMP/review83/supplement22.ts" original/packages/core/src/Controller.stop.test.ts
          git -C candidate apply --check "$RUNNER_TEMP/review83/candidate.patch"
          git -C candidate apply "$RUNNER_TEMP/review83/candidate.patch"
          python3 "$RUNNER_TEMP/review83/guard.py" capture original
          python3 "$RUNNER_TEMP/review83/guard.py" capture candidate
          git -C candidate diff --check
          node --version
          pnpm --version
      - name: Install frozen official native browser environments
        shell: bash
        run: |
          set -euo pipefail
          (cd original && pnpm install --frozen-lockfile)
          (cd candidate && pnpm install --frozen-lockfile)
          (cd candidate && pnpm exec playwright install --with-deps chromium)
      - name: Capture original immutable six-case output before assessment
        working-directory: original
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm exec vitest run --project unit packages/core/src/visual52-review83.test.ts --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/review83/original.json" 2>&1 | tee "$RUNNER_TEMP/review83/original.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$RUNNER_TEMP/review83/original.status"
          echo "VISUAL52_REVIEW83_ORIGINAL_EXIT_STATUS $status"
          echo VISUAL52_REVIEW83_ORIGINAL_RAW_JSON_BEGIN
          if test -f "$RUNNER_TEMP/review83/original.json"; then
            cat "$RUNNER_TEMP/review83/original.json"
          else
            echo VISUAL52_REVIEW83_REPORT_MISSING
          fi
          echo VISUAL52_REVIEW83_ORIGINAL_RAW_JSON_END
          python3 "$RUNNER_TEMP/review83/receipt.py" original "$RUNNER_TEMP/review83" .
      - name: Capture candidate immutable six-case output before assessment
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm exec vitest run --project unit packages/core/src/visual52-review83.test.ts --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/review83/candidate.json" 2>&1 | tee "$RUNNER_TEMP/review83/candidate.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > "$RUNNER_TEMP/review83/candidate.status"
          echo "VISUAL52_REVIEW83_CANDIDATE_EXIT_STATUS $status"
          echo VISUAL52_REVIEW83_CANDIDATE_RAW_JSON_BEGIN
          if test -f "$RUNNER_TEMP/review83/candidate.json"; then
            cat "$RUNNER_TEMP/review83/candidate.json"
          else
            echo VISUAL52_REVIEW83_REPORT_MISSING
          fi
          echo VISUAL52_REVIEW83_CANDIDATE_RAW_JSON_END
          python3 "$RUNNER_TEMP/review83/receipt.py" candidate "$RUNNER_TEMP/review83" .
      - name: Assess strict controls and completeness without a diagnostic pattern
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/review83/assess.py" "$RUNNER_TEMP/review83"
      - name: Verify every tracked byte index tree source and frozen fixture
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/review83/guard.py" verify original
          python3 "$RUNNER_TEMP/review83/guard.py" verify candidate
          echo VISUAL52_REVIEW83_ALL_SOURCE_FIXTURE_GUARDS_PASS
