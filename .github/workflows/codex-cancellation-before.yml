name: visual52 native BEFORE
on:
  push:
    branches: [codex/diagnose-cancelled-start-promises]
permissions:
  contents: read
jobs:
  native-before:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: pmndrs/react-spring
          ref: 83e476061290532ab517c4d4dfd60de21589e78e
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.14.0
          run_install: false
      - name: Freeze whole upstream and public fixture
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 83e476061290532ab517c4d4dfd60de21589e78e
          git diff --exit-code
          git diff --cached --exit-code
          git ls-files -z | xargs -0 sha256sum > "$RUNNER_TEMP/tracked-before.sha256"
          git ls-files -s > "$RUNNER_TEMP/index-before.txt"
          git write-tree > "$RUNNER_TEMP/tree-before.txt"
          mkdir -p packages/core/src
          python3 - <<'PYFIXTURE'
          import base64,hashlib,pathlib
          data=base64.b64decode('')
          assert hashlib.sha256(data).hexdigest() == '968ace61c8ce54eb303b3f0673874ea1836c829a101a8f8faf79ef8f9a575e32'
          pathlib.Path('packages/core/src/visual52-native-before.test.ts').write_bytes(data)
          PYFIXTURE
          sha256sum packages/core/src/visual52-native-before.test.ts > "$RUNNER_TEMP/fixture-before.sha256"
          node --version
          pnpm --version
      - name: Install exact upstream lock and Chromium
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Run native browser suite and require precise behavioral RED
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm exec vitest run --project unit packages/core/src/visual52-native-before.test.ts --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/visual52-native.json" 2>&1 | tee "$RUNNER_TEMP/visual52-native.log"
          status=${PIPESTATUS[0]}
          set -e
          test "$status" = 1
          python3 - <<'PYREPORT'
          import json,pathlib,os
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          d=json.loads((root/'visual52-native.json').read_text())
          assert d['numTotalTests']==10,d
          assert d['numPassedTests']==6,d
          assert d['numFailedTests']==4,d
          assert d.get('numRuntimeErrorTestSuites',0)==0,d
          rows=[a for f in d['testResults'] for a in f['assertionResults']]
          assert len(rows)==10
          for row in rows:
            red=' RED ' in row['fullName']
            assert row['status']==('failed' if red else 'passed'),row
            if red:
              msg=' '.join(row.get('failureMessages',[]))
              assert 'expected false to be true' in msg,msg
          log=(root/'visual52-native.log').read_text()
          import re
          payloads=[json.loads(match.group(1)) for line in log.splitlines() if (match := re.search(r'VISUAL52_CASE (\{.*\})\s*$', re.sub(r'\x1b\[[0-9;]*m','',line)))]
          assert not d.get('unhandledErrors') and not d.get('errors'),d
          assert len(payloads)==4,payloads
          for x in payloads:
            assert x['settled'] is False and x['continuation'] is False and x['result'] is None and x['value']==0,x
          print('VISUAL52_NATIVE_BEFORE_JSON '+json.dumps({'pin':'83e476061290532ab517c4d4dfd60de21589e78e','red':payloads,'passed_controls':6,'failed_expected':4,'runtime_errors':0},sort_keys=True))
          PYREPORT
      - name: Verify complete source index tree and fixture remained frozen
        if: always()
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check "$RUNNER_TEMP/tracked-before.sha256" > /dev/null
          sha256sum --check "$RUNNER_TEMP/fixture-before.sha256"
          git ls-files -s > "$RUNNER_TEMP/index-after.txt"
          cmp "$RUNNER_TEMP/index-before.txt" "$RUNNER_TEMP/index-after.txt"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/tree-before.txt")"
          test "$(git rev-parse HEAD)" = 83e476061290532ab517c4d4dfd60de21589e78e
          git diff --exit-code
          git diff --cached --exit-code
          test "$(git ls-files --others --exclude-standard | grep -v '^packages/core/src/visual52-native-before.test.ts$' | wc -l | tr -d ' ')" = 0
          echo VISUAL52_ALL_TRACKED_INDEX_TREE_FIXTURE_FROZEN
